name: game-over-pld

services:
  inventory:
    image: node:22-alpine
    working_dir: /app
    command: ["node", "private/inventory/server.mjs"]
    volumes:
      - ./private:/app/private:ro
      - ./work:/app/work:ro
    environment:
      PORT: "4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 2s
      retries: 15

  api:
    image: node:22-alpine
    working_dir: /app
    command: ["node", "private/api/server.mjs"]
    volumes:
      - ./private:/app/private:ro
      - ./work:/app/work:ro
      - ./docker-compose.yml:/app/docker-compose.yml:ro
      - ./README.md:/app/README.md:ro
      - ./CONSIGNES_ETUDIANTS.md:/app/CONSIGNES_ETUDIANTS.md:ro
    environment:
      PORT: "3000"
      INVENTORY_URL: http://inventory:4000
    depends_on:
      inventory:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 2s
      retries: 15

  web:
    image: nginx:stable-alpine
    ports:
      - "8080:80"
    volumes:
      - ./private/web:/usr/share/nginx/html:ro
      - ./work/web:/opt/game-over-work:ro
      - ./private/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
